name: Publicar painel

# O Anuário sai uma vez por ano, em julho. O workflow roda a cada push e sob
# demanda; para pegar uma edição nova basta acrescentá-la em ingest/fontes.py.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # O pipeline inteiro, do download ao JSON: são quatro planilhas e o dbt
      # build leva menos de um segundo.
      - run: make pipeline
      - run: make docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
