name: Publicar painel

# A página vai pronta no repositório: painel/dados.js é gerado localmente por
# `make pipeline` e a documentação do dbt por `make docs`. O workflow só
# publica a pasta, sem depender de o site do FBSP responder ao runner.
on:
  push:
    branches: [master]
    paths: ["painel/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel
      - id: deploy
        uses: actions/deploy-pages@v4
